spring.application.name=Cobabe Code LMS

# Recognize HTTPS forwarded through Cloudflare Tunnel
server.forward-headers-strategy=framework
# Session cookie security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
# Session security
server.servlet.session.timeout=60m
# Allow only local connections to Spring Boot
server.address=127.0.0.1
# H2 Database
spring.datasource.url=jdbc:h2:file:./data/javaclassroom
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (local development only)
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
spring.h2.console.enabled=false

app.runner.url=http://localhost:8090
app.runner.token=${RUNNER_TOKEN}

cobabe.runner.enabled=false
cobabe.runner.url=http://127.0.0.1:8090


# Gmail SMTP configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${COBABE_MAIL_USERNAME}
spring.mail.password=${COBABE_MAIL_PASSWORD}

# SMTP security
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Connection timeouts (milliseconds)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=520MB
