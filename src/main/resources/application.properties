spring.application.name=Cobabe Code LMS
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/javaclassroom
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (local development only)
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

app.runner.url=http://localhost:8090
app.runner.token=${RUNNER_TOKEN}

cobabe.runner.enabled=false
cobabe.runner.url=http://127.0.0.1:8090


# Gmail SMTP configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${COBABE_MAIL_USERNAME}
spring.mail.password=${COBABE_MAIL_PASSWORD}

# SMTP security
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Connection timeouts (milliseconds)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
