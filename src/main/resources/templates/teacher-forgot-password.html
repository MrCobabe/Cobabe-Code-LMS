
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Cobabe Code LMS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111827;
            color: #f9fafb;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            padding: 32px;
            width: 100%;
            max-width: 430px;
        }

        h1 {
            color: #fb923c;
            margin-top: 0;
            font-size: 26px;
        }

        p {
            color: #d1d5db;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #4b5563;
            border-radius: 5px;
            background: #111827;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #f97316;
            color: #111827;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #fb923c;
        }

        .success {
            background: #064e3b;
            color: #d1fae5;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 16px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #fb923c;
            text-decoration: none;
        }
    </style>
</head>

<body>
<div class="card">

    <h1>Forgot Password?</h1>

    <p>
        Enter your verified teacher recovery email address.
        If an account matches, we'll send you a password
        reset link.
    </p>

    <div class="success"
         th:if="${success}"
         th:text="${success}">
    </div>

    <form th:action="@{/teacher/forgot-password}"
          method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <label for="email">Recovery Email</label>

        <input type="email"
               id="email"
               name="email"
               placeholder="teacher@example.com"
               autocomplete="email"
               required>

        <button type="submit">
            Send Reset Link
        </button>

    </form>

    <a class="back" th:href="@{/}">
        Back to Login
    </a>

</div>
</body>
</html>
