
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header"
          th:content="${_csrf.headerName}">

    <title>Java Sandbox | Cobabe Code LMS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px 24px;
            background: #1e293b;
            border-bottom: 1px solid #475569;
        }

        h1 {
            margin: 0;
            color: #fb923c;
            font-size: 22px;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            padding: 20px;
            max-width: 1500px;
            margin: auto;
        }

        .panel {
            background: #111827;
            border: 1px solid #475569;
            border-radius: 8px;
            overflow: hidden;
        }

        .panel-heading {
            background: #1e293b;
            padding: 12px 16px;
            font-weight: bold;
            font-size: 14px;
        }

        #editor {
            height: 420px;
            width: 100%;
        }

        textarea {
            display: block;
            width: 100%;
            padding: 14px;
            background: #0b1220;
            color: #f8fafc;
            border: none;
            resize: vertical;
            font-family: Consolas, monospace;
            font-size: 14px;
        }

        #programInput {
            min-height: 80px;
        }

        #consoleOutput {
            min-height: 160px;
            padding: 14px;
            margin: 0;
            color: #86efac;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-family: Consolas, monospace;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        button,
        .back {
            background: #f97316;
            color: #111827;
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .back {
            background: #334155;
            color: white;
        }

        .hint {
            color: #94a3b8;
            font-size: 12px;
            margin: 0;
        }

        #saveStatus {
            color: #94a3b8;
            font-size: 13px;
        }

        .dev-warning {
            color: #ffb347;
            font-size: 13px;
            margin: 0;
        }
    </style>
</head>

<body>

<header>
    <h1>Cobabe Code — Java Sandbox</h1>

    <div class="actions">

        <p class="dev-warning">
            Development mode: Java execution is not sandboxed.
        </p>

        <span id="saveStatus">
            Loading editor...
        </span>

        <button id="runButton"
                onclick="runJava()"
                disabled>
            ▶ Run
        </button>

        <a class="back" th:href="@{/student}">
            Dashboard
        </a>

    </div>
</header>

<main class="workspace">

    <section class="panel">
        <div class="panel-heading">Main.java</div>
        <div id="editor"></div>
    </section>

    <section class="panel">
        <div class="panel-heading">Program Input</div>

        <textarea
                id="programInput"
                placeholder="Enter input for Scanner here, one line at a time."></textarea>
    </section>

    <section class="panel">
        <div class="panel-heading">Console Output</div>

        <pre id="consoleOutput">Click Run to execute your program.</pre>
    </section>

    <p class="hint">
        Java Sandbox — practice code is not submitted for grading.
        Your Java code is automatically saved.
    </p>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>

<script th:inline="javascript">

    const runUrl =
        /*[[@{/api/student/java/run}]]*/
        "/api/student/java/run";

    const starterCode = [
        "public class Main {",
        "    public static void main(String[] args) {",
        "        System.out.println(\"Hello, Dragons!\");",
        "    }",
        "}"
    ].join("\n");

    let editor = null;

    const saveStatus =
        document.getElementById("saveStatus");

    const runButton =
        document.getElementById("runButton");

    let saveTimer = null;
    let loadingCode = true;
    let loadSucceeded = false;
    let lastSavedCode = null;
    let saveInProgress = false;

    function csrfHeaders() {
        const csrfToken =
            document.querySelector('meta[name="_csrf"]').content;

        const csrfHeader =
            document.querySelector('meta[name="_csrf_header"]').content;

        return {
            "Content-Type": "application/json",
            [csrfHeader]: csrfToken
        };
    }

    // ---------------------------------------
    // LOAD SAVED SANDBOX CODE
    // ---------------------------------------

    async function loadSandboxCode() {

        saveStatus.textContent = "Loading saved code...";

        try {
            const response = await fetch(
                "/api/student/sandbox/load",
                { cache: "no-store" }
            );

            if (!response.ok) {
                throw new Error(
                    "Load failed: HTTP " + response.status
                );
            }

            const data = await response.json();

            if (data.found) {
                editor.setValue(data.code);
            }

            lastSavedCode = editor.getValue();
            loadSucceeded = true;

            saveStatus.textContent =
                data.found ? "Saved code loaded" : "Ready";

        } catch (error) {

            console.error(
                "Sandbox load error:",
                error
            );

            saveStatus.textContent =
                "Could not load saved code";

            // Do not allow automatic saving if loading
            // failed, because that could overwrite
            // existing code in the database.
            loadSucceeded = false;

        } finally {
            loadingCode = false;
        }
    }

    // ---------------------------------------
    // SAVE SANDBOX CODE
    // ---------------------------------------

    async function saveSandboxCode() {

        if (
            loadingCode ||
            !loadSucceeded ||
            saveInProgress ||
            !editor
        ) {
            return;
        }

        const code = editor.getValue();

        if (code === lastSavedCode) {
            saveStatus.textContent = "Saved";
            return;
        }

        saveInProgress = true;
        saveStatus.textContent = "Saving...";

        try {

            const response = await fetch(
                "/api/student/sandbox/save",
                {
                    method: "POST",
                    headers: csrfHeaders(),
                    body: JSON.stringify({ code })
                }
            );

            if (!response.ok) {
                throw new Error(
                    "Save failed: HTTP " + response.status
                );
            }

            lastSavedCode = code;

            saveStatus.textContent =
                editor.getValue() === code
                    ? "Saved"
                    : "Unsaved changes";

        } catch (error) {

            console.error(
                "Sandbox save error:",
                error
            );

            saveStatus.textContent = "Save failed";

        } finally {

            saveInProgress = false;

            // If the student continued typing while
            // the request was in progress, save again.
            if (
                editor &&
                editor.getValue() !== lastSavedCode
            ) {
                scheduleSandboxSave();
            }
        }
    }

    // ---------------------------------------
    // AUTOSAVE TIMER
    // ---------------------------------------

    function scheduleSandboxSave() {

        if (
            loadingCode ||
            !loadSucceeded ||
            !editor
        ) {
            return;
        }

        clearTimeout(saveTimer);

        if (editor.getValue() === lastSavedCode) {
            saveStatus.textContent = "Saved";
            return;
        }

        saveStatus.textContent = "Unsaved changes";

        saveTimer = setTimeout(
            saveSandboxCode,
            1500
        );
    }

    // ---------------------------------------
    // INITIALIZE MONACO
    // ---------------------------------------

    require.config({
        paths: {
            vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs"
        }
    });

    require(
        ["vs/editor/editor.main"],
        async function () {

            editor = monaco.editor.create(
                document.getElementById("editor"),
                {
                    value: starterCode,
                    language: "java",
                    theme: "vs-dark",
                    automaticLayout: true,
                    minimap: { enabled: false },
                    fontSize: 15,
                    tabSize: 4,
                    insertSpaces: true,
                    scrollBeyondLastLine: false
                }
            );

            // Monaco now exists.
            // Load saved code before enabling autosave.
            await loadSandboxCode();

            editor.onDidChangeModelContent(
                scheduleSandboxSave
            );

            runButton.disabled = false;
        }
    );

    // ---------------------------------------
    // RUN JAVA
    // ---------------------------------------

    async function runJava() {

        const output =
            document.getElementById("consoleOutput");

        if (!editor) {
            output.textContent =
                "Editor is still loading.";
            return;
        }

        runButton.disabled = true;
        runButton.textContent = "Running...";

        output.textContent =
            "Sending code to server...";

        try {

            const response = await fetch(
                runUrl,
                {
                    method: "POST",
                    headers: csrfHeaders(),
                    body: JSON.stringify({
                        code: editor.getValue(),
                        input: document.getElementById(
                            "programInput"
                        ).value
                    })
                }
            );

            const result = await response.json();

            output.textContent =
                [result.output, result.error]
                    .filter(Boolean)
                    .join("\n") || "No output.";

            if (!response.ok) {
                output.textContent =
                    result.error ||
                    "Request failed: " + response.status;
            }

        } catch (error) {

            console.error(
                "Java execution error:",
                error
            );

            output.textContent =
                "Could not contact Java runner: " +
                error.message;

        } finally {

            runButton.disabled = false;
            runButton.textContent = "▶ Run";
        }
    }

</script>

</body>
</html>
