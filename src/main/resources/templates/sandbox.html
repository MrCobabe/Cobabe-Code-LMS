
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header"
          th:content="${_csrf.headerName}">
    <meta name="sandbox-id" th:content="${sandboxId}">

    <title>Java Sandbox | Cobabe Code LMS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px 24px;
            background: #1e293b;
            border-bottom: 1px solid #475569;
        }

        h1 {
            margin: 0;
            color: #fb923c;
            font-size: 22px;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            padding: 20px;
            max-width: 1500px;
            margin: auto;
        }

        .panel {
            background: #111827;
            border: 1px solid #475569;
            border-radius: 8px;
            overflow: hidden;
        }

        .panel-heading {
            background: #1e293b;
            padding: 12px 16px;
            font-weight: bold;
            font-size: 14px;
        }

        .console-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        #editor {
            height: 420px;
            width: 100%;
        }

        textarea {
            display: block;
            width: 100%;
            padding: 14px;
            background: #0b1220;
            color: #f8fafc;
            border: none;
            resize: vertical;
            font-family: Consolas, monospace;
            font-size: 14px;
        }

        #programInput {
            min-height: 80px;
        }

        #consoleOutput {
            min-height: 160px;
            padding: 14px;
            margin: 0;
            color: #86efac;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-family: Consolas, monospace;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        button,
        .back {
            background: #f97316;
            color: #111827;
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .back {
            background: #334155;
            color: white;
        }

        .hint {
            color: #94a3b8;
            font-size: 12px;
            margin: 0;
        }

        #saveStatus {
            color: #94a3b8;
            font-size: 13px;
        }

        .dev-warning {
            color: #ffb347;
            font-size: 13px;
            margin: 0;
        }
    </style>
</head>

<body>

<header>
    <div>
        <h1 id="sandboxTitle">Java Sandbox</h1>
        <p class="hint">Practice Java programming</p>
    </div>

    <div class="actions">

        <span id="saveStatus">
            Loading editor...
        </span>

        <button id="runButton"
                onclick="runJava()"
                disabled>
            ▶ Run
        </button>

        <!-- Teacher navigation -->
        <a class="back"
           th:if="${teacherMode == true}"
           th:href="@{/teacher/sandboxes}">
            My Sandboxes
        </a>

        <a class="back"
           th:if="${teacherMode == true}"
           th:href="@{/teacher}">
            Dashboard
        </a>

        <!-- Student navigation -->
        <a class="back"
           th:unless="${teacherMode == true}"
           th:href="@{/student/sandboxes}">
            My Sandboxes
        </a>

        <a class="back"
           th:unless="${teacherMode == true}"
           th:href="@{/student}">
            Dashboard
        </a>

    </div>
</header>

<main class="workspace">

    <section class="panel">
        <div class="panel-heading">Main.java</div>
        <div id="editor"></div>
    </section>

    <section class="panel">
        <div class="panel-heading">Program Input</div>

        <textarea
                id="programInput"
                placeholder="Enter input for Scanner here, one line at a time."></textarea>
    </section>

    <section class="panel">
        <div class="panel-heading console-heading">
            <span>Console Output</span>

            <button id="consoleRunButton"
                    onclick="runJava()"
                    disabled>
                ▶ Run
            </button>
        </div>

        <pre id="consoleOutput">Click Run to execute your program.</pre>
    </section>

    <p class="hint">
        Java Sandbox — practice code is not submitted for grading.
        Your Java code is automatically saved.
    </p>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>

<script th:inline="javascript">

    // ---------------------------------------
    // TEACHER / STUDENT CONFIGURATION
    // ---------------------------------------

    const teacherMode = /*[[${teacherMode == true}]]*/ false;

    const runUrl = teacherMode
        ? /*[[@{/teacher/api/java/run}]]*/ "/teacher/api/java/run"
        : /*[[@{/api/student/java/run}]]*/ "/api/student/java/run";

    const sandboxApiBase = teacherMode
        ? /*[[@{/teacher/api/sandbox}]]*/ "/teacher/api/sandbox"
        : /*[[@{/api/student/sandbox}]]*/ "/api/student/sandbox";

    const starterCode = [
        "public class Main {",
        "    public static void main(String[] args) {",
        "        System.out.println(\"Hello, Dragons!\");",
        "    }",
        "}"
    ].join("\n");

    let editor = null;

    const saveStatus =
        document.getElementById("saveStatus");

    const runButton =
        document.getElementById("runButton");

    const consoleRunButton =
        document.getElementById("consoleRunButton");

    let javaRunning = false;

    function setRunButtonsRunning(running) {
        javaRunning = running;

        for (const button of [runButton, consoleRunButton]) {
            button.disabled = running || !editor;
            button.textContent = running ? "Running..." : "▶ Run";
        }
    }

    const sandboxId = document.querySelector(
        'meta[name="sandbox-id"]'
    )?.content;

    let saveTimer = null;
    let loadingCode = true;
    let loadSucceeded = false;
    let lastSavedCode = null;
    let saveInProgress = false;

    // ---------------------------------------
    // CSRF HEADERS
    // ---------------------------------------

    function csrfHeaders() {
        const csrfToken =
            document.querySelector(
                'meta[name="_csrf"]'
            ).content;

        const csrfHeader =
            document.querySelector(
                'meta[name="_csrf_header"]'
            ).content;

        return {
            "Content-Type": "application/json",
            [csrfHeader]: csrfToken
        };
    }

    // ---------------------------------------
    // LOAD SAVED SANDBOX CODE
    // ---------------------------------------

    async function loadSandboxCode() {

        saveStatus.textContent = "Loading saved code...";

        try {
            if (!sandboxId || !/^\d+$/.test(sandboxId)) {
                throw new Error(
                    "No valid sandbox ID was provided."
                );
            }

            const response = await fetch(
                `${sandboxApiBase}/${sandboxId}/load`,
                { cache: "no-store" }
            );

            if (!response.ok) {
                throw new Error(
                    "Load failed: HTTP " + response.status
                );
            }

            const data = await response.json();

            if (!data.found) {
                throw new Error("Sandbox not found.");
            }

            document.getElementById("sandboxTitle")
                .textContent = data.name;

            editor.setValue(data.code);

            lastSavedCode = editor.getValue();
            loadSucceeded = true;

            saveStatus.textContent = "Saved code loaded";

        } catch (error) {

            console.error(
                "Sandbox load error:",
                error
            );

            saveStatus.textContent =
                "Could not load sandbox — saving disabled";

            loadSucceeded = false;

        } finally {
            loadingCode = false;
        }
    }

    // ---------------------------------------
    // SAVE SANDBOX CODE
    // ---------------------------------------

    async function saveSandboxCode() {

        if (
            loadingCode ||
            !loadSucceeded ||
            saveInProgress ||
            !editor
        ) {
            return;
        }

        const code = editor.getValue();

        if (code === lastSavedCode) {
            saveStatus.textContent = "Saved";
            return;
        }

        saveInProgress = true;
        saveStatus.textContent = "Saving...";

        try {

            const response = await fetch(
                `${sandboxApiBase}/${sandboxId}/save`,
                {
                    method: "POST",
                    headers: csrfHeaders(),
                    body: JSON.stringify({ code })
                }
            );

            if (!response.ok) {
                throw new Error(
                    "Save failed: HTTP " + response.status
                );
            }

            lastSavedCode = code;

            saveStatus.textContent =
                editor.getValue() === code
                    ? "Saved"
                    : "Unsaved changes";

        } catch (error) {

            console.error(
                "Sandbox save error:",
                error
            );

            saveStatus.textContent =
                "Save failed: " + error.message;

        } finally {

            saveInProgress = false;

            if (
                editor &&
                loadSucceeded &&
                editor.getValue() !== lastSavedCode
            ) {
                scheduleSandboxSave();
            }
        }
    }

    // ---------------------------------------
    // AUTOSAVE TIMER
    // ---------------------------------------

    function scheduleSandboxSave() {

        if (
            loadingCode ||
            !loadSucceeded ||
            !editor
        ) {
            return;
        }

        clearTimeout(saveTimer);

        if (editor.getValue() === lastSavedCode) {
            saveStatus.textContent = "Saved";
            return;
        }

        saveStatus.textContent = "Unsaved changes";

        saveTimer = setTimeout(
            saveSandboxCode,
            1500
        );
    }

    // ---------------------------------------
    // INITIALIZE MONACO EDITOR
    // ---------------------------------------

    require.config({
        paths: {
            vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs"
        }
    });

    require(
        ["vs/editor/editor.main"],
        async function () {

            editor = monaco.editor.create(
                document.getElementById("editor"),
                {
                    value: starterCode,
                    language: "java",
                    theme: "vs-dark",
                    automaticLayout: true,
                    minimap: { enabled: false },
                    fontSize: 15,
                    tabSize: 4,
                    insertSpaces: true,
                    scrollBeyondLastLine: false
                }
            );

            await loadSandboxCode();

            editor.onDidChangeModelContent(
                scheduleSandboxSave
            );

            setRunButtonsRunning(false);
        }
    );

    // ---------------------------------------
    // RUN JAVA CODE
    // ---------------------------------------

    async function runJava() {

        if (javaRunning) {
            return;
        }

        const output =
            document.getElementById("consoleOutput");

        if (!editor) {
            output.textContent =
                "Editor is still loading.";
            return;
        }

        setRunButtonsRunning(true);

        output.textContent =
            "Sending code to server...";

        try {

            const response = await fetch(
                runUrl,
                {
                    method: "POST",
                    headers: csrfHeaders(),
                    body: JSON.stringify({
                        code: editor.getValue(),
                        input: document.getElementById(
                            "programInput"
                        ).value
                    })
                }
            );

            if (!response.ok) {
                let errorMessage =
                    "Request failed: HTTP " + response.status;

                try {
                    const errorData = await response.json();

                    errorMessage =
                        errorData.error ||
                        errorData.message ||
                        errorMessage;

                } catch (ignored) {
                    // Response was not JSON.
                }

                output.textContent = errorMessage;
                return;
            }

            const result = await response.json();

            output.textContent =
                [result.output, result.error]
                    .filter(Boolean)
                    .join("\n") || "No output.";

        } catch (error) {

            console.error(
                "Java execution error:",
                error
            );

            output.textContent =
                "Could not contact Java runner: " +
                error.message;

        } finally {

            setRunButtonsRunning(false);
        }
    }

</script>

</body>
</html>
