
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password | Cobabe Code LMS</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 32px;
            width: min(420px, 90%);
        }

        h1 {
            color: #fb923c;
            margin-top: 0;
        }

        p {
            color: #cbd5e1;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #020617;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            background: #f97316;
            color: #111827;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: #fecaca;
            background: #7f1d1d;
            padding: 12px;
            border-radius: 8px;
        }

        .hint {
            font-size: 13px;
            color: #94a3b8;
        }

        a {
            color: #fdba74;
        }
    </style>
</head>

<body>
<main class="card">

    <h1>🔐 Change Password</h1>

    <p th:if="${firstLogin}">
        Welcome to Cobabe Code!
        Before you begin, choose a new password.
    </p>

    <p th:unless="${firstLogin}">
        Update your account password below.
    </p>

    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form th:action="@{/student/password}" method="post">

        <label for="currentPassword">
            Current Password
        </label>
        <input type="password"
               id="currentPassword"
               name="currentPassword"
               autocomplete="current-password"
               required>

        <label for="newPassword">
            New Password
        </label>
        <input type="password"
               id="newPassword"
               name="newPassword"
               minlength="4"
               maxlength="128"
               autocomplete="new-password"
               required>

        <p class="hint">
            Use at least 8 characters.
            A few memorable words work well.
        </p>

        <label for="confirmPassword">
            Confirm New Password
        </label>
        <input type="password"
               id="confirmPassword"
               name="confirmPassword"
               minlength="4"
               maxlength="128"
               autocomplete="new-password"
               required>

        <button type="submit">
            Save New Password
        </button>
    </form>

    <p th:unless="${firstLogin}">
        <a th:href="@{/student}">
            ← Back to Dashboard
        </a>
    </p>

</main>
</body>
</html>
