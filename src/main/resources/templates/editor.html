<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Java Editor</title><link rel="stylesheet" href="/style.css"></head><body><header><a href="/dashboard">← Assignments</a><strong th:text="${assignment.title}"></strong></header><main><p th:text="${assignment.description}"></p><form id="runform" method="post" action="/api/run"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label for="code">Main.java</label><textarea id="code" name="code" spellcheck="false" rows="18" th:text="${assignment.starterCode}"></textarea><label for="stdin">Program input (stdin)</label><textarea id="stdin" name="stdin" rows="3"></textarea><button type="submit">▶ Run</button></form><pre id="output">Console output will appear here.</pre><form th:action="@{/assignment/{id}/submit(id=${assignment.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="code" id="submissionCode"><button type="submit" onclick="document.getElementById('submissionCode').value=document.getElementById('code').value">Submit assignment</button></form></main><script>document.getElementById('runform').addEventListener('submit',async e=>{e.preventDefault();let out=document.getElementById('output');out.textContent='Running...';try{let r=await fetch('/api/run',{method:'POST',body:new FormData(e.target)});out.textContent=await r.text();}catch(e){out.textContent='Request failed';}});</script></body></html>
