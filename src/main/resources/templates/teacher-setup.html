
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Teacher Account Setup | Cobabe Code</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .setup-card {
            background: white;
            padding: 32px;
            border-radius: 10px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(0,0,0,.1);
        }

        h1 {
            margin-top: 0;
            color: #222;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 24px;
            background: #e87516;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .error {
            color: #b00020;
        }
    </style>
</head>

<body>
<div class="setup-card">

    <h1>Set Up Teacher Account</h1>

    <p>
        Before using Cobabe Code, please configure
        your teacher account.
    </p>

    <p class="error"
       th:if="${error}"
       th:text="${error}">
    </p>

    <form th:action="@{/teacher/setup}" method="post">

        <label for="username">New Username</label>
        <input id="username"
               name="username"
               type="text"
               required
               minlength="3"
               autocomplete="username">

        <label for="password">New Password</label>
        <input id="password"
               name="password"
               type="password"
               required
               minlength="6"
               autocomplete="new-password">

        <label for="confirmPassword">
            Confirm Password
        </label>
        <input id="confirmPassword"
               name="confirmPassword"
               type="password"
               required
               minlength="6"
               autocomplete="new-password">

        <label for="recoveryEmail">Recovery Email</label>
        <input id="recoveryEmail"
               name="recoveryEmail"
               type="email"
               required
               autocomplete="email">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <button type="submit">
            Complete Setup
        </button>

    </form>
</div>
</body>
</html>
