
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Cobabe Code LMS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            color: #f9fafb;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 32px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
            color: #fb923c;
            font-size: 26px;
        }

        p {
            color: #d1d5db;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #111827;
            color: white;
            border: 1px solid #4b5563;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            background: #f97316;
            color: #111827;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #fb923c;
        }

        .success {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 5px;
            background: #064e3b;
            color: #d1fae5;
        }

        .error {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 5px;
            background: #7f1d1d;
            color: #fee2e2;
        }

        .back {
            display: block;
            margin-top: 24px;
            color: #fb923c;
            text-align: center;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Reset Password</h1>

    <p>
        Choose a new password for your
        Cobabe Code LMS teacher account.
    </p>

    <!-- Success message -->
    <div class="success"
         th:if="${success}"
         th:text="${success}">
    </div>

    <!-- Error message -->
    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <!-- Show form only for valid tokens -->
    <form th:if="${validToken}"
          th:action="@{/teacher/reset-password}"
          method="post">

        <!-- CSRF protection -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <!-- Password reset token -->
        <input type="hidden"
               name="token"
               th:value="${token}">

        <label for="password">
            New Password
        </label>

        <input type="password"
               id="password"
               name="password"
               minlength="6"
               autocomplete="new-password"
               required>

        <label for="confirmPassword">
            Confirm New Password
        </label>

        <input type="password"
               id="confirmPassword"
               name="confirmPassword"
               minlength="6"
               autocomplete="new-password"
               required>

        <button type="submit">
            Reset Password
        </button>

    </form>

    <a class="back" th:href="@{/}">
        Back to Login
    </a>

</div>

</body>
</html>
