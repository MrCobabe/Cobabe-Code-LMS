<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Review submission</title><link rel="stylesheet" href="/style.css"></head><body><header><a href="/dashboard">← Gradebook</a></header><main><h1 th:text="${submission.student.name} + ' — ' + ${submission.assignment.title}"></h1><form id="runform" method="post" action="/api/run"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><textarea id="code" name="code" rows="18" th:text="${submission.code}"></textarea><label>Console input</label><textarea name="stdin" rows="3"></textarea><button>▶ Run student's code</button></form><pre id="output"></pre><h2>Grade</h2><form th:action="@{/teacher/submission/{id}/grade(id=${submission.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="grade" type="number" min="0" max="100" required th:value="${submission.grade}" placeholder="Score / 100"><textarea name="feedback" maxlength="4000" th:text="${submission.feedback}" placeholder="Feedback"></textarea><button>Save grade</button></form></main><script>document.getElementById('runform').addEventListener('submit',async e=>{e.preventDefault();let o=document.getElementById('output');o.textContent='Running...';try{let r=await fetch('/api/run',{method:'POST',body:new FormData(e.target)});o.textContent=await r.text()}catch(e){o.textContent='Request failed'}})</script></body></html>
