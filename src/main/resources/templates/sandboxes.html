<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header"
          th:content="${_csrf.headerName}">

    <title>My Sandboxes | Cobabe Code LMS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f172a;
            color: #f8fafc;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        h1 {
            color: #fb923c;
            font-size: 36px;
            font-weight: 400;
            margin: 0 0 8px;
        }

        .muted {
            color: #94a3b8;
            margin: 0;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button, .button {
            display: inline-block;
            padding: 10px 16px;
            border: none;
            border-radius: 7px;
            background: #f97316;
            color: #111827;
            font: inherit;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        button:hover, .button:hover {
            background: #fb923c;
        }

        .secondary {
            background: #334155;
            color: #f8fafc;
        }

        .secondary:hover {
            background: #475569;
        }

        .danger {
            background: #7f1d1d;
            color: white;
        }

        .danger:hover {
            background: #991b1b;
        }

        .sandbox {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 14px;
        }

        .sandbox-info {
            flex: 1;
            min-width: 180px;
        }

        .sandbox-info h2 {
            font-size: 20px;
            font-weight: 500;
            margin: 0 0 8px;
        }

        .sandbox-info p {
            color: #94a3b8;
            font-size: 13px;
            margin: 0;
        }

        .empty {
            padding: 45px 20px;
            text-align: center;
            background: #1e293b;
            border: 1px dashed #475569;
            border-radius: 12px;
            color: #94a3b8;
        }

        #message {
            margin-bottom: 18px;
            color: #fbbf24;
        }
    </style>
</head>

<body>

<main class="container">

    <header>
        <div>
            <h1>My Sandboxes</h1>
            <p class="muted">
                Create and save your own Java programs.
            </p>
        </div>

        <div class="actions">
            <button onclick="createSandbox()">
                + New Sandbox
            </button>


            <a class="button secondary"
               th:if="${teacherMode == true}"
               th:href="@{/teacher}">
                Dashboard
            </a>

            <a class="button secondary"
               th:unless="${teacherMode == true}"
               th:href="@{/student}">
                Dashboard
            </a>


        </div>
    </header>

    <p id="message" role="status"></p>

    <div id="sandboxList">
        <div class="empty">Loading sandboxes...</div>
    </div>

</main>

<script th:inline="javascript">


    const teacherMode = /*[[${teacherMode == true}]]*/ false;

    const apiBase = teacherMode
        ? /*[[@{/teacher/api/sandbox}]]*/ "/teacher/api/sandbox"
        : /*[[@{/api/student/sandbox}]]*/ "/api/student/sandbox";

    const editorBase = teacherMode
        ? /*[[@{/teacher/sandbox}]]*/ "/teacher/sandbox"
        : /*[[@{/student/sandbox}]]*/ "/student/sandbox";


    const listElement =
        document.getElementById("sandboxList");

    const messageElement =
        document.getElementById("message");

    function csrfHeaders() {
        const token = document.querySelector(
            'meta[name="_csrf"]'
        ).content;

        const header = document.querySelector(
            'meta[name="_csrf_header"]'
        ).content;

        return {
            "Content-Type": "application/json",
            [header]: token
        };
    }

    async function loadSandboxes() {
        try {
            const response = await fetch(
                `${apiBase}/list`,
                {cache: "no-store"}
            );

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}`
                );
            }

            const sandboxes = await response.json();

            listElement.replaceChildren();

            if (sandboxes.length === 0) {
                const empty = document.createElement("div");
                empty.className = "empty";
                empty.textContent =
                    "No sandboxes yet. Create one to get started!";
                listElement.appendChild(empty);
                return;
            }

            sandboxes.forEach(program => {
                const card = document.createElement("div");
                card.className = "sandbox";

                const info = document.createElement("div");
                info.className = "sandbox-info";

                const title = document.createElement("h2");
                title.textContent = program.name;

                const date = document.createElement("p");
                date.textContent = program.lastSaved
                    ? "Last saved: " +
                    new Date(program.lastSaved).toLocaleString()
                    : "Not saved yet";

                info.append(title, date);

                const actions = document.createElement("div");
                actions.className = "actions";

                const open = document.createElement("a");
                open.className = "button";
                open.textContent = "Open";
                open.href = `${editorBase}/${program.id}`;

                const rename = document.createElement("button");
                rename.className = "secondary";
                rename.textContent = "Rename";
                rename.onclick = () =>
                    renameSandbox(program.id, program.name);

                const remove = document.createElement("button");
                remove.className = "danger";
                remove.textContent = "Delete";
                remove.onclick = () =>
                    deleteSandbox(program.id, program.name);

                actions.append(open, rename, remove);
                card.append(info, actions);
                listElement.appendChild(card);
            });

        } catch (error) {
            console.error(error);
            messageElement.textContent =
                "Could not load sandboxes.";
        }
    }

    async function createSandbox() {
        const name = prompt(
            "Name your new sandbox:",
            "Untitled Sandbox"
        );

        if (name === null) return;

        if (!name.trim()) {
            alert("Please enter a sandbox name.");
            return;
        }

        try {
            const response = await fetch(
                `${apiBase}/create`,
                {
                    method: "POST",
                    headers: csrfHeaders(),
                    body: JSON.stringify({name})
                }
            );

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}`
                );
            }

            const program = await response.json();

            window.location.href =
                `${editorBase}/${program.id}`;

        } catch (error) {
            console.error(error);
            messageElement.textContent =
                "Could not create sandbox.";
        }
    }

    async function renameSandbox(id, currentName) {
        const name = prompt(
            "Rename sandbox:",
            currentName
        );

        if (name === null) return;

        if (!name.trim()) {
            alert("Please enter a sandbox name.");
            return;
        }

        try {
            const response = await fetch(
                `${apiBase}/${id}/rename`,
                {
                    method: "POST",
                    headers: csrfHeaders(),
                    body: JSON.stringify({name})
                }
            );

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}`
                );
            }

            await loadSandboxes();

        } catch (error) {
            console.error(error);
            messageElement.textContent =
                "Could not rename sandbox.";
        }
    }

    async function deleteSandbox(id, name) {
        const confirmed = confirm(
            `Delete "${name}"?\n\n` +
            "This permanently deletes its saved Java code."
        );

        if (!confirmed) return;

        try {
            const response = await fetch(
                `${apiBase}/${id}`,
                {
                    method: "DELETE",
                    headers: csrfHeaders()
                }
            );

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}`
                );
            }

            await loadSandboxes();

        } catch (error) {
            console.error(error);
            messageElement.textContent =
                "Could not delete sandbox.";
        }
    }

    loadSandboxes();

</script>

</body>
</html>
