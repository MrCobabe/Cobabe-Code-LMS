
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Email Verification - Cobabe Code LMS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            color: #243447;
            font-size: 25px;
        }

        .success {
            color: #176b35;
            background: #e6f4ea;
            padding: 15px;
            border-radius: 5px;
        }

        .error {
            color: #a12622;
            background: #fce8e6;
            padding: 15px;
            border-radius: 5px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #1769aa;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Cobabe Code LMS</h1>
    <h2>Recovery Email Verification</h2>

    <div th:if="${success}"
         class="success"
         th:text="${success}">
    </div>

    <div th:if="${error}"
         class="error"
         th:text="${error}">
    </div>

    <a th:href="@{/teacher/account}">
        Return to Teacher Account
    </a>

</div>
</body>
</html>
